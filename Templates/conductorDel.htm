
{% extends "base.html" %}

{% block contenido %}

<div class="container mt-5">
    <div class="row">
        <div class="col-10 offset-1">
            <h3>Confirmar eliminación de conductor</h3>

            <div class="alert alert-danger h5">
                ¿Estás seguro de que deseas eliminar al conductor
                {{ conductor.nombre_completo }}?
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col">
                        <a class="btn btn-dark" href="{% url 'conductores' %}">Cancelar</a>
                    </div>
                    <div class="col">
                        <button class="btn btn-danger" type="submit">Confirmar eliminación</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
