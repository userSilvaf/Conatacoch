{% extends "base.html" %}
{% load static %}

{% block contenido %}

<div class="container mt-5 mb-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">

            <div class="card shadow-lg login-card">

                            <a href="{% url 'paginaPrincipal' %}" class="btn btn-secondary me-2">
                                Cancelar

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
